<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    input { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 24px; }
    li { padding: 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    .del-btn { padding: 4px 10px; font-size: 0.85rem; color: #fff; background: #c0392b; border: none; border-radius: 4px; cursor: pointer; }
    .del-btn:hover { background: #a93226; }
    #status { margin-top: 8px; font-size: 0.9rem; color: #555; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>

  <input type="text" id="textInput" placeholder="Skriv något..." />
  <button id="saveBtn">Spara</button>
  <p id="status"></p>

  <h2>Sparade meddelanden</h2>
  <ul id="entriesList"></ul>

  <script type="module" src="hello.js?v=2"></script>
</body>
</html>
